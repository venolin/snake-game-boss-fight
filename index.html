<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="game-container">
        <h1>Snake Game</h1>
        <div class="score">Score: <span id="score">0</span></div>
        <div class="game-board" id="game-board"></div>
        <div class="controls">
            <button id="start-btn">Start Game</button>
            <button id="pause-btn">Pause</button>
            <button id="reset-btn">Reset</button>
        </div>
        <div class="instructions">
            <p>Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to control the snake.</p>
            <p>Eat the red food to grow and earn points!</p>
        </div>
    </div>
    
    <div class="game-over" id="game-over">
        <h2>Game Over!</h2>
        <p>Your final score: <span id="final-score">0</span></p>
        <button id="restart-btn">Play Again</button>
    </div>
    
    <div class="boss-fight" id="boss-fight">
        <h2>Boss Fight!</h2>
        <div class="boss-health">Boss Health: <span id="boss-health">100</span></div>
        <p>Defeat the boss to win the game!</p>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
